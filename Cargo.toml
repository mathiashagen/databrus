[package]
name = "databrus"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Finn de billigste energidrikkene i Norge"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mathiashagen/databrus"
readme = "README.md"
keywords = ["cli", "norway", "prices", "groceries"]
categories = ["command-line-utilities"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "databrus"
path = "src/main.rs"

[features]
# Tester som treffer ekte kilder over nettverket. Kjøres nattlig i CI.
live-tests = []

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
anstream = "1.0.0"
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
comfy-table = "8.0.1"
directories = "6.0.0"
governor = "0.10.4"
indicatif = "0.18.6"
jiff = { version = "0.2.37", features = ["tzdb-bundle-always", "serde"] }
nucleo-matcher = "0.3.1"
owo-colors = "4.4.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2", "charset", "gzip"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2.2.2"
insta = { version = "1.48.0", features = ["json", "yaml"] }
predicates = "3.1.4"
proptest = "1.11.0"
tempfile = "3.27.0"
wiremock = "0.6.5"
